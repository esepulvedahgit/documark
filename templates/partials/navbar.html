<nav class="bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-5xl mx-auto px-4 flex items-center justify-between h-14">
    <div class="flex items-center gap-6">
      <a href="{% if request.current_user %}{% url 'converter:dashboard' %}{% else %}{% url 'accounts:login' %}{% endif %}"
         class="flex items-center gap-2 text-indigo-600">
        <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3.5h8l4 4V19a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" />
          <path d="M14 3.5V8h4" />
          <path d="M12 11v6" />
          <path d="M9.5 14.5 12 17l2.5-2.5" />
        </svg>
        <span class="text-xl font-semibold tracking-tight">documark</span>
      </a>
      {% if request.current_user %}
        <a href="{% url 'converter:dashboard' %}" class="text-sm text-gray-600 hover:text-indigo-600">Dashboard</a>
        <a href="{% url 'converter:convert' %}" class="text-sm text-gray-600 hover:text-indigo-600">Convertir</a>
        <a href="{% url 'converter:history' %}" class="text-sm text-gray-600 hover:text-indigo-600">Mi historial</a>
        {% if request.current_user.role == "admin" %}
          <a href="{% url 'accounts:user_list' %}" class="text-sm text-gray-600 hover:text-indigo-600">Usuarios</a>
          <a href="{% url 'converter:admin_history' %}" class="text-sm text-gray-600 hover:text-indigo-600">Historial global</a>
        {% endif %}
      {% endif %}
    </div>
    {% if request.current_user %}
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-500">
          {{ request.current_user.username }}
          <span class="ml-1 inline-block rounded-full bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5">{{ request.current_user.role }}</span>
        </span>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="text-sm text-gray-500 hover:text-red-600">Salir</button>
        </form>
      </div>
    {% endif %}
  </div>
</nav>
