services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No volume: Redis here is purely a Celery broker + rate-limit cache,
    # not business data. Losing it on restart drops in-flight/queued
    # conversions and rate-limit counters, both self-healing — see README
    # "Limitaciones".

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documark}
      POSTGRES_USER: ${POSTGRES_USER:-documark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documark}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documark} -d ${POSTGRES_DB:-documark}"]
      interval: 5s
      timeout: 5s
      retries: 10

  documark:
    build: .
    image: documark:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build: .
    image: documark:latest
    command: celery -A config worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build: .
    image: documark:latest
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
